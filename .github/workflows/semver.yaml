name: Version Bump

on:
  push:
    branches:
      - main  # run on any branch push

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - id: semver-tag
        uses: gandarez/semver-action@master
        with:
          branching_model: "trunk-based"
          main_branch_name: "main"
          major_regex: "^majorupdate/.*"
          minor_regex: "^feature/.*"
          patch_regex: ".*"
          prefix: ""  # no 'v' prefix

      - name: Push tag to GitHub
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.semver-tag.outputs.semver_tag }}
          git push origin ${{ steps.semver-tag.outputs.semver_tag }}

      - name: Show new version
        run: |
          echo "New version: ${{ steps.semver-tag.outputs.semver_tag }}"
          echo "New tag: ${{ steps.semver-tag.outputs.semver_tag }}"
