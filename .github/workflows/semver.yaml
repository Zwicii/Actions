name: Version Bump

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: ${{ github.event_name == 'pull_request' && format('Next: v{0}', steps.bump.outputs.version) || format('v{0}', steps.bump.outputs.version) }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🎯 Determine version
        id: bump
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
          BRANCH=${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          
          case "$BRANCH" in
            majorupdate/*) NEW="$((MAJOR+1)).0.0" ;;
            feature/*)     NEW="$MAJOR.$((MINOR+1)).0" ;;
            *)             NEW="$MAJOR.$MINOR.$((PATCH+1))" ;;
          esac
          
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "📦 $CURRENT → 🎯 $NEW"

      - name: 🏷️ Create tag
        if: github.event_name == 'push'
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git tag -a "v${{ steps.bump.outputs.version }}" -m "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"