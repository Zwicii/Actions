name: Version Bump

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  determine:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🎯 Determine version
        id: bump
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
          
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          
          case "$BRANCH" in
            majorupdate/*) NEW="$((MAJOR+1)).0.0" ;;
            feature/*)     NEW="$MAJOR.$((MINOR+1)).0" ;;
            *)             NEW="$MAJOR.$MINOR.$((PATCH+1))" ;;
          esac
          
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "📦 $CURRENT → 🎯 $NEW"

  tag:
    needs: determine
    runs-on: ubuntu-latest
    name: 🏷️ v${{ needs.determine.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Create tag
        if: github.event_name == 'push'
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git tag -a "v${{ needs.determine.outputs.version }}" -m "v${{ needs.determine.outputs.version }}"
          git push origin "v${{ needs.determine.outputs.version }}"
          
      - name: 👀 Preview
        if: github.event_name == 'pull_request'
        run: echo "Will create v${{ needs.determine.outputs.version }} when merged"