name: Version Bump

on:
  push:
    branches:
      - '**'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:

      # 1️⃣ Checkout repo with full history
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2️⃣ Determine current version & branch
      - name: Get current version
        id: get_version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      # 3️⃣ Calculate next version
      - name: Bump version
        id: bump_version
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.get_version.outputs.version }}"

          if [[ "${{ steps.get_version.outputs.branch }}" == majorupdate/* ]]; then
            MAJOR=$((MAJOR+1))
            MINOR=0
            PATCH=0
          elif [[ "${{ steps.get_version.outputs.branch }}" == feature/* ]]; then
            MINOR=$((MINOR+1))
            PATCH=0
          else
            PATCH=$((PATCH+1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      # 4️⃣ Push tag
      - run: |
          tag=${{ steps.bump_version.outputs.new_version }}
          message='${{ steps.bump_version.outputs.new_version }}'
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a "${tag}" -m "${message}"
          git push origin "${tag}"

      # 5️⃣ Output
      - run: |
          echo "New version: ${{ steps.bump_version.outputs.new_version }}"
          echo "New tag: ${{ steps.bump_version.outputs.new_version }}"
