name: Version Bump

on:
  push:
    branches: ['**']

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔢 Calculate new version
        id: version
        run: |
          # 📋 Get current version or default to 1.0.0
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
          BRANCH=${GITHUB_REF##*/}
          
          echo "📦 Current version: $CURRENT"
          echo "🌿 Branch: $BRANCH"
          
          # 🔍 Parse version numbers
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          
          # 🚀 Bump based on branch name
          case "$BRANCH" in
            majorupdate/*) NEW="$((MAJOR+1)).0.0"; echo "💥 Major version bump!" ;;
            feature/*)     NEW="$MAJOR.$((MINOR+1)).0"; echo "✨ Feature version bump!" ;;
            *)             NEW="$MAJOR.$MINOR.$((PATCH+1))"; echo "🔧 Patch version bump!" ;;
          esac
          
          echo "new_version=$NEW" >> $GITHUB_OUTPUT
          echo "🎯 New version: $NEW"

      - name: 🏷️ Create and push tag
        run: |
          # 🛠️ Configure git
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          
          # 📌 Create tag
          git tag -a "${{ steps.version.outputs.new_version }}" -m "Version ${{ steps.version.outputs.new_version }}"
          
          # 🚢 Push tag
          git push origin "${{ steps.version.outputs.new_version }}"
          
          echo "✅ Successfully tagged and pushed version: ${{ steps.version.outputs.new_version }}"