name: 📝 Semantic Versioning

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  calculate:
    name: 🎯 Calculate Next Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔢 Determine Version
        id: bump
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
          
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.head_ref }}"
          else
            # Extract branch name from merge commit message
            MERGE_MSG=$(git log -1 --pretty=format:"%s")
            if [[ "$MERGE_MSG" =~ from\ [^/]+/(.+)$ ]]; then
              BRANCH="${BASH_REMATCH[1]}"
            else
              BRANCH="main"
            fi
          fi
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          
          case "$BRANCH" in
            *majorupdate*) NEW="$((MAJOR+1)).0.0" ;;
            *feature*)     NEW="$MAJOR.$((MINOR+1)).0" ;;
            *)             NEW="$MAJOR.$MINOR.$((PATCH+1))" ;;
          esac
          
          echo "BRANCH=$BRANCH"
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "📦 $CURRENT → 🎯 $NEW"

  tag:
    name: 🏷️ ${{ needs.calculate.outputs.version }}
    needs: calculate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Create and Push Tag
        if: github.event_name == 'push'
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git tag -a "${{ needs.calculate.outputs.version }}" -m "${{ needs.calculate.outputs.version }}"
          git push origin "${{ needs.calculate.outputs.version }}"
          
