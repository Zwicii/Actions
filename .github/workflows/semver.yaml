name: Version Bump

on:
  push:
    branches:
      - '**'

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # get full history to find tags

      # 2️⃣ Determine the branch and current version
      - name: Get current version
        id: get_version
        run: |
          # Use the latest tag or default to 1.0.0
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "1.0.0")
          echo "Current version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Get branch name
          BRANCH_NAME=${GITHUB_REF##*/}
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

      # 3️⃣ Calculate the next version
      - name: Bump version
        id: bump_version
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.get_version.outputs.version }}"

          if [[ "${{ steps.get_version.outputs.branch }}" == majorupdate/* ]]; then
            MAJOR=$((MAJOR+1))
            MINOR=0
            PATCH=0
          elif [[ "${{ steps.get_version.outputs.branch }}" == feature/* ]]; then
            MINOR=$((MINOR+1))
            PATCH=0
          else
            PATCH=$((PATCH+1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      # 4️⃣ Tag and push
      - name: Tag and push version
        run: |
          run: |
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git tag ${{ steps.bump_version.outputs.new_version }}
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} --tags

      # 5️⃣ Output version
      - name: Show new version
        run: |
          echo "New version: ${{ steps.bump_version.outputs.new_version }}"
          echo "New tag: ${{ steps.bump_version.outputs.new_version }}"
